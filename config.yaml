# ============================================
# 抖音账号视频自动总结 - 配置文件
# ============================================
# 本地运行时使用此文件配置
# GitHub Actions 运行时通过 Secrets 环境变量覆盖

# 抖音账号配置（已禁用 - 抖音 TikHub API 不稳定）
douyin:
  enabled: false                    # 是否监控抖音
  unique_id: "zhenrutie001"       # 抖音号（用户提供的）
  sec_uid: "MS4wLjABAAAAf0C1gFEdMvoFGiiMUZbYQeLVpezDCv4fyNjWk9W2myE"  # 已验证，预填可省一次API调用
  nickname: "真如铁"                # 昵称（用于推送消息标题）

# 微信视频号配置（用于获取视频号视频）
# 注意：视频号 API 需要 TikHub 付费余额（不支持免费额度）
wechat_channels:
  enabled: true                     # 是否同时监控微信视频号
  channel_id: "sphAdqjvDpQ0D"      # 视频号分享链接中的ID（weixin.qq.com/sph/后面的部分，前面加上 sph）
  username: "v2_060000231003b20faec8cae7801fc6d6c705ed3cb077234a77da602d1dc993b891e39a8e6ec5@finder"  # finder username（v2_...@finder 格式），可留空由程序自动解析
  nickname: "笑傲江湖真如铁"        # 视频号昵称（用于推送消息标题）

# TikHub API 配置（用于获取抖音用户视频列表、微信视频号视频）
# 注册地址: https://user.tikhub.io
# 新用户有免费额度，按量计费约 $0.01/次
tikhub:
  api_key: ""
  # .dev 域名国内外均可访问，更稳定；.io 在国内/GitHub Actions 偶发连接中断
  base_url: "https://api.tikhub.dev/api/v1"

# 大模型 API 配置（用于内容总结）
# 推荐 DeepSeek：便宜、中文好、国内可访问
# 注册地址: https://platform.deepseek.com
llm:
  provider: "deepseek"             # deepseek / openai / qwen
  api_key: ""
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"

# Whisper 语音转文字配置
whisper:
  model_size: "base"               # tiny / base / small / medium（越大越准但越慢）
  language: "zh"                   # 语言
  device: "cpu"                    # cpu / cuda

# 推送配置
push:
  method: "serverchan"             # serverchan（Server酱）/ wecom（企业微信机器人）

  # Server酱（推荐，最简单）
  # 注册地址: https://sct.ftqq.com
  # 微信扫码登录后获取 SendKey
  serverchan_key: ""

  # 企业微信机器人（备选）
  # 在企业微信群聊中添加机器人，获取 Webhook URL
  wecom_webhook: ""

# 运行配置
runtime:
  lookback_hours: 72               # 向前查看72小时的视频（临时调大以处理7月30日视频）
  max_videos_per_run: 10           # 每次最多处理10条视频
  temp_dir: "./temp"               # 临时文件目录
  state_file: "state.json"         # 状态文件（记录已处理的视频）
